name: 🔄 Auto Submit URLs
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2am UTC
jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google
        run: curl -s "https://www.google.com/ping?sitemap=https://www.indigocn.com/sitemap.xml" -o /dev/null -w "Google: %{http_code}\n"
      - name: Ping Bing
        run: curl -s "https://www.bing.com/ping?sitemap=https://www.indigocn.com/sitemap.xml" -o /dev/null -w "Bing: %{http_code}\n"
      - name: Ping IndexNow
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"www.indigocn.com","key":"not-required-for-now","urlList":["https://www.indigocn.com/","https://www.indigocn.com/products/","https://www.indigocn.com/tech/","https://www.indigocn.com/faq/","https://www.indigocn.com/geo-qa/index.json"]}' \
            -o /dev/null -w "IndexNow: %{http_code}\n"
